<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Sister!</title>

    <link rel="icon" href="./favicon.png" type="image/png">
    <!-- Add links to the beautiful font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <!-- Add script to the confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  </head>

  <body>
    <!-- Audio element -->
    <audio id="bg-music" src="./assets/sounds/🎉 Best Birthday Song 🎂 The Most Popular Birthday Song Ever.mp3"
      loop></audio>

    <canvas id="sparkles-canvas"></canvas>

    <div class="intro-screen" id="intro">
      <h1>Happy Birthday, Sister! 💖</h1>
      <p class="subtitle">You are the most amazing person in my life. Thank you for all our smiles, secrets, and
        support.
        This digital gift is for you!</p>
      <button class="music-btn" id="start-btn">Turn on the music and magic ✨</button>
    </div>

    <div class="scene-container">
      <h2 class="scene-title">You're the best! 📸</h2>

      <div class="scene" id="scene">
        <div class="carousel" id="carousel">
        </div>
      </div>
    </div>
  </body>

</html>
